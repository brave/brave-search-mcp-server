name: Docker

on:
  push:
    branches:
      - main
  pull_request:
  # The image can break with no change here: Alpine drops superseded package
  # versions, so the exact-version apk pins stop resolving. Catch that before a release.
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
  # Build Release gates publishing on this workflow.
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          # Amazon Bedrock AgentCore only runs ARM64 images.
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.x'

      # The image builds itself and the tests run from source, so skip `prepare`.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Check Dockerfile
        run: docker buildx build --check .

      - name: Build image and run container tests
        run: npm run test:docker
